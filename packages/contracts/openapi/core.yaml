    "/c/{slug}/sessions/{id}": {
      "get": {
        "operationId": "getSession",
        "tags": [
          "sessions"
        ],
        "responses": {
          "200": {
            "description": "The full session: id, title, date, startTime, slotMinutes, status, version, participants, games and skippedPlayers. ETag is the quoted version, so a later If-None-Match can answer 304; Cache-Control is no-store."
          },
          "304": {
            "description": "Not modified: If-None-Match matched the current ETag, with w/ prefixes and * honoured. The body is empty; ETag repeats the current version and Cache-Control is no-store."
          },
          "400": {
            "description": "INVALID_INPUT: the id is not a UUID, so the cast to uuid fails.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
