            "type": "string"
          },
          "detail": {
            "type": "string",
            "description": "Already redacted by the server; may be empty."
          },
          "retryAfter": {
            "type": "integer",
            "description": "Seconds to wait before retrying. Present only on 429 and equal to the Retry-After header."
          },
          "issues": {
            "type": "array",
            "description": "Field-level rejections. Present only on 400 for createTournament, putTournament and patchTournamentMatch.",
            "items": {
              "type": "object",
              "required": [
