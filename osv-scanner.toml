# Dated, id-scoped exceptions for `./task osv-scan` (SEC-05).
#
# An entry here silences one advisory id until `ignoreUntil`; the scan stops
# honouring it on that date, so a forgotten exception turns the build red again
# instead of living forever. The policy behind an entry is written down in
# docs/handbook/deps-format.md section 8.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-18
reason = "picomatch ReDoS through repeated extglobs. Reached only through the build toolchain (vite 8, vitest 5, tinyglobby 0.2.17, workbox-build), never from the shipped bundle, and every pattern globbed is one this repository writes. No fixed release exists: the advisory range is introduced 0 through 4.0.7 and 4.0.7 is the latest publish, so neither a bump nor a downgrade clears it. Recheck on expiry."
