<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/logo-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0e13">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MAJADU">
    <title>MAJADU</title>
    <!-- UI typefaces are self-hosted from /fonts (latin subset). The page makes
         no third-party font request, `font-src 'self'` covers every one of
         them, and the service worker precaches them, so no preload is needed:
         a preload that the worker answers trips a "not used" warning in Safari. -->
    <!-- UI faces plus the decorative ones for social exports.
         deps.lock hashes every file referenced here. -->
    <style>
      @font-face { font-family: 'IBM Plex Sans'; src: url('/fonts/ibm-plex-sans-latin-var.woff2') format('woff2'); font-weight: 400 700; font-style: normal; font-display: swap; }
      @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/ibm-plex-mono-latin-400.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/ibm-plex-mono-latin-500.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Road Rage'; src: url('/road-rage.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Edosz'; src: url('/edosz.ttf') format('truetype'); font-display: swap; }
    </style>
    <!-- The PWA plugin injects the only manifest (`/manifest.webmanifest`); a
         second hand-written one would let the two drift apart. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
