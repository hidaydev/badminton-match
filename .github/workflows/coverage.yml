# Coverage gate (T-109). Its own workflow so a coverage regression does not block
# the fast CI jobs, and so the instrumented build never shares a cache with them.
#
# The gate compares against coverage-baseline-linux.json: a domain or the total
# that drops fails the run. The baseline is per platform because llvm-gcov and
# gcc's gcov attribute lines differently; CI judges the Linux file. Absolute
# targets (module 90%, total 75%) are reached by raising the baseline, not by
# failing every PR until the whole codebase moves.
#
# Measurement is split across a matrix because the instrumented build of every
# test file does not fit in one 15 minute job. Each `measure` job writes the
# parts for its slice and stops; `ratchet` merges them and produces the only
# verdict. A shard never judges, so a suite, capture or merge that fails still
# fails its own job and no partial report can stand in for the whole tree.
name: Coverage

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # Recording the Linux baseline is an explicit operator action: it rewrites
  # coverage-baseline-linux.json from the merged report, which a normal run only
  # judges. The input is read through env, never interpolated into a shell.
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Record coverage-baseline-linux.json from the merged report"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One group per push: a shared group with cancel-in-progress false does not
  # serialise politely, it queues the new run and cancels any run already
  # waiting in that group, so a third push can drop the second commit's ratchet
  # entirely. The sha makes every push its own group and its own full run.
  group: "coverage-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.head.sha) || format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) }}"
  # Only a pull request may cancel an earlier run. A second push to main used to
  # cancel the first, so the ratchet on the commit that is actually deployed
  # never finished.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: "2.4.0"

jobs:
  measure:
    name: "Coverage: measure shard ${{ matrix.shard }} of 4"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      # The diff-coverage gate needs a merge base, so the clone cannot be a
      # single commit: with `fetch-depth: 1` there is no base to diff against and
      # the gate would skip instead of judging the changed lines (D-15).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # The same pins `deps.lock` and `ci.yml` use. apt ships lcov 2.0 and
      # gcovr 7.0 against the locked 2.6 and 8.8, and a measurement taken with
      # a different tool is not a measurement of the same thing.
      - name: "Dependencies: install pinned coverage tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl \
            libdevel-stacktrace-perl
          python3 -m pip install --break-system-packages gcovr==8.8
          git clone --depth 1 --branch v2.6 \
            https://github.com/linux-test-project/lcov "$RUNNER_TEMP/lcov"
          sudo make -C "$RUNNER_TEMP/lcov" install LCOV_NO_DOC=1 LCOV_NO_XS=1
      # Printed for the log; `./task deps-check` is what turns a version that is
      # not the exact pin into a failure.
      - name: "Dependencies: pinned coverage tool versions"
        run: |
          lcov --version
          gcovr --version
      - name: "Dependencies: installed content must match deps.lock"
        # The frontend gate tools are not installed in this job: it compiles and
        # runs Nim suites only. `--skip` verifies everything this job does
        # install; the E2E job is where the npm and browser pins are checked.
        run: ./task deps-check --skip npm,playwright-browser
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template; the integration half
          # of the coverage run writes rows it does not own, so it gets the
          # disposable bm2_test database.
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` only creates empty databases; the integration half of the
      # coverage run needs the schema and the reference rows.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # TL-07: the import suite is measured only when it runs, and it skips
      # itself without all four DSNs (QA-10). The target is a fresh copy of the
      # migrated database, so the instrumented run never writes into bm2_dev.
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          # A source without the bm schema would import nothing and still read
          # as clean, so the job fails before the suite can run.
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      # A shard measures and reports its slice, then exits without judging.
      # `ratchet` is the only job that runs the ratchet, and a suite, capture or
      # merge that fails still fails this job.
      - name: "Coverage: measure this shard"
        env:
          SHARD: ${{ matrix.shard }}/4
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: ./task coverage --shard "$SHARD"
      # QA-11: a shard that fails under instrumentation leaves the last suite log
      # and the timing table behind.
      - name: "Coverage: upload this shard's failure log"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-failure-${{ matrix.shard }}
          path: |
            .cache/*/coverage/last-test.log
            .cache/*/coverage/lcov-capture.log
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn
      # Only a successful shard uploads. The condition is omitted, so the step
      # inherits the default `success()`: a failed measurement is not presented
      # as a complete slice, and `if-no-files-found: error` still catches a
      # measure run that produced nothing.
      - name: "Coverage: upload this shard's parts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-parts-${{ matrix.shard }}
          path: .cache/*/coverage/parts-${{ matrix.shard }}-of-4
          # The parts live under a dot directory, and the action skips hidden
          # paths unless this is set.
          include-hidden-files: true
          if-no-files-found: error

  ratchet:
    name: "Coverage: ratchet"
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The diff-coverage gate needs a merge base, so the ratchet needs the full
      # history even though it never compiles anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The merge only needs lcov, and it has to be the locked 2.6: a report
      # written by 2.0 and merged by 2.6 is not the same measurement.
      - name: "Coverage: install the pinned lcov"
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl \
            libdevel-stacktrace-perl
          git clone --depth 1 --branch v2.6 \
            https://github.com/linux-test-project/lcov "$RUNNER_TEMP/lcov"
          sudo make -C "$RUNNER_TEMP/lcov" install LCOV_NO_DOC=1 LCOV_NO_XS=1
          lcov --version
      # `download-artifact` v7 has no v7.0.1 tag; v7.0.0 is the release in the
      # same line the upload step pins, and both are first-party actions.
      - name: "Coverage: download the shard parts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-parts-*
          path: .cache/coverage-parts
      # A rewritten PR history can leave no merge base. task.d/coverage.sh
      # reports that as a skip so local runs without a remote still work; on a
      # pull request the gate refuses instead of silently dropping the diff.
      - name: "Coverage: the merge base exists"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git merge-base HEAD "origin/$BASE_REF" >/dev/null 2>&1; then
            echo "::error::no merge base with origin/$BASE_REF; fetch the base branch or rebase the pull request"
            exit 1
          fi
      - name: "Coverage: judge or refresh the merged report"
        env:
          PARTS: .cache/coverage-parts
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
        run: |
          if [ "$UPDATE_BASELINE" = "true" ]; then
            ./task coverage --parts "$PARTS" --update --allow-decrease
          else
            ./task coverage --parts "$PARTS"
          fi
      # The baseline lives at the repository root and is not hidden, so the
      # upload does not need `include-hidden-files`.
      - name: "Coverage: upload the Linux baseline"
        if: inputs.update_baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-baseline-linux
          path: coverage-baseline-linux.json
          if-no-files-found: error
