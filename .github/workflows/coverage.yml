# Coverage gate (T-109). Its own workflow so a coverage regression does not block
# the fast CI jobs, and so the instrumented build never shares a cache with them.
#
# The gate compares against coverage-baseline.json: a domain or the total that
# drops fails the run. Absolute targets (module 90%, total 75%) are reached by
# raising the baseline, not by failing every PR until the whole codebase moves.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: "2.4.0"

jobs:
  coverage:
    name: "Coverage: ratchet"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66c329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "Coverage: install gcov tooling"
        run: sudo apt-get update && sudo apt-get install -y lcov gcovr
      - name: "Database: provision"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: ./task dev-db
      - name: "Coverage: measure against the baseline"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_dev
        run: ./task coverage
