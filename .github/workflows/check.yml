name: Check

on:
  push:
    branches: [ui-revamp, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check:types
      - name: Lint
        run: npm run check:lint
      - name: Tailwind check
        run: npm run check:tailwind
      - name: Regression tests
        run: npm run check:regression
