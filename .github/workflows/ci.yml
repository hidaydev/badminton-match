name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # QA-03: recording a visual baseline is an explicit operator action, never a
  # branch that CI takes on its own when the Linux set is absent.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Record the Linux visual baseline instead of comparing it"
        type: boolean
        default: false

permissions:
  contents: read

# One run per commit within an event class. Pull requests group by head SHA, so
# two PR runs for the same commit dedupe; pushes and dispatch runs group by
# event and ref. A push and a PR for the same SHA therefore never share a group,
# so a PR run cannot cancel a strict release-push run. Only pull requests cancel
# a run in progress.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.head.sha) || format('{0}-{1}', github.event_name, github.ref) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: "2.4.0"

# The runner image is pinned instead of `ubuntu-latest`. The `ubuntu-latest`
# label moved to Ubuntu 26 on 2026-10-19 and broke the pinned lcov build, so the
# workflows stay on the image the toolchain is validated against. Runtime C
# libraries and Perl modules are installed explicitly below rather than assumed.

jobs:
  api-check:
    name: "API: check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # QA-11: `./task check` runs the TypeScript coverage gate, so this job
      # needs the workspace installed as well as Nim.
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # D-6: `check` runs the database-backed suites, so this job provisions the
      # same disposable database the integration job uses.
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # QA-10: `check` runs the import suite, which now refuses to skip. It
      # needs the small v1 source and the production-shaped source, each with
      # its own migrated target, so this job provisions all four.
      - name: "Import: provision the v1 sources and the v2 targets"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "API: check"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: ./task check
      # QA-11: a red check leaves the per-suite JUnit report, the failure list
      # and the timing table on the runner; this makes them downloadable.
      - name: "API: upload failure reports"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-check-results
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn

  api-test:
    name: "API: integration (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Two shards of the sorted suite list. The list is split by position, so both
    # jobs run the same files every time, and each has its own database service
    # on its own runner. `./task test --timing` records per-suite wall time.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task test`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` only creates empty databases. The integration suites assume the
      # schema and the reference rows exist, so they run against a migrated
      # database, using the same dbtools path `./task dev` uses.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # TL-07: the import suite reads a v1 database and writes a v2 one, and it
      # skips itself when either DSN is unset. The source is the captured v1
      # schema plus the fixture the cases assert against; the target is a fresh
      # copy of the migrated database, so the suite never writes into bm2_dev.
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          # QA-10: the production-shaped fixture (104 players, 1,040 games)
          # has its own pair, because verify maps every source row into one
          # community.
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          # An empty source must not pass as a clean import: the cases compare
          # against rows in the bm schema, so a source without one fails here.
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "API: test"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
          SHARD: ${{ matrix.shard }}
        run: ./task test --timing --shard "$SHARD/2"
      - name: "API: timing report"
        if: always()
        run: |
          for f in .cache/*/timing/test.tsv; do
            [ -f "$f" ] || continue
            echo "== $f"
            sort -t"$(printf '\t')" -k2,2nr "$f" | head -10
          done
      # QA-11: JUnit, the machine-readable failure list and the timing table
      # from this shard, uploaded only when the shard fails.
      - name: "API: upload failure reports"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results-${{ matrix.shard }}
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn

  contract:
    name: "Contract: generated files"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # Fails when the two source specs, the merged document, the generated Nim
      # routes, or the generated TS client no longer match
      # packages/contracts/openapi/CONTRACT.sha256. A spec edit must land with a
      # regenerated fingerprint so the contract change is reviewable.
      - name: "Contract: fingerprint and generated files must match the specs"
        run: ./task contract-check
      # ISO-11: a quoted migration or operation count is a claim. Compare it with
      # the directory and CONTRACT.sha256 instead of maintaining a second copy.
      - name: "Docs: quoted counts match the artefacts"
        run: ./task docs-check
      # Offline: both corpora are hashed against their MANIFEST.sha256 and every
      # case is linted against the generated routes. The recorded cases are the
      # only per-route behaviour record, so a fixture edit that skips the
      # manifest update fails here instead of on a replay.
      - name: "Parity: corpus manifest and lint"
        run: ./task parity verify && ./task parity v2 lint

  supply-chain:
    name: "Supply chain: scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commits in this run, not only the working tree.
          fetch-depth: 0
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      # No pnpm cache here: the job audits the lockfile without installing, so
      # the store directory never exists and setup-node's post step failed the
      # job trying to save it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # A tag ref is mutable and a 41-character SHA is a different commit that
      # GitHub still resolves; the guard fails on both before the scanners run.
      - name: "Supply chain: every action is pinned to a 40-hex SHA"
        run: ./task ci-guards
      - name: "Supply chain: audit the frontend lockfile"
        run: pnpm audit --audit-level=high --prod
      - name: "Supply chain: scan for committed secrets"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Filesystem first: it sees dependency manifests and source even when the
      # image job cannot run. The image itself is scanned on every release.
      - name: "Supply chain: scan for vulnerable dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  web:
    name: "Web: build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      - name: "Web: check"
        run: pnpm check:web
      - name: "Web: build"
        run: pnpm build:web
      - name: "Scoreboard: build"
        run: pnpm build:scoreboard
      # PWA-03: the scoreboard is the build used in the hall, and no gate
      # produced its installable artifact. The target asserts the service worker
      # precache covers the shell and the entry chunk built index.html asks for.
      - name: "Scoreboard: assert the service worker precache"
        run: ./task scoreboard-pwa

  e2e:
    name: "E2E: browser"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      - name: "E2E: install browsers"
        run: pnpm exec playwright install --with-deps
      # deps.lock also pins the coverage tools, and `./task deps-check` compares
      # the versions they report exactly. apt on the runner ships lcov 2.0 and
      # gcovr 7.0 against the locked 2.6 and 8.8, so both come from upstream.
      # The doc and XS targets are skipped: they need sphinx and a C++20 build
      # and contribute nothing to `lcov --version`. `LCOV_NO_XS=1` skips only
      # the XS modules, so the pure Perl ones lcov 2.6 loads at startup still
      # have to be present.
      - name: "Dependencies: install pinned coverage tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl \
            libdevel-stacktrace-perl
          python3 -m pip install --break-system-packages gcovr==8.8
          git clone --depth 1 --branch v2.6 \
            https://github.com/linux-test-project/lcov "$RUNNER_TEMP/lcov"
          sudo make -C "$RUNNER_TEMP/lcov" install LCOV_NO_DOC=1 LCOV_NO_XS=1
      # Printed for the log; `./task deps-check` below is what turns a version
      # that is not the exact pin in deps.lock into a failure.
      - name: "Dependencies: pinned coverage tool versions"
        run: |
          lcov --version
          gcovr --version
      - name: "Dependencies: installed content must match deps.lock"
        run: ./task deps-check
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `./task e2e` opens its database as the OS user, so the runner needs
          # a role. `PGPASSWORD` (set on the run step) supplies the password the
          # harness's passwordless DSN does not carry.
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      # Pixel baselines live in `e2e/__screenshots__/{platform}/` and CI only
      # compares them. While the Linux set is absent, a tag or a release branch
      # fails hard; main and pull requests warn and skip the visual comparison so
      # the rest of the suite still runs. Once the directory exists every ref
      # runs the full comparison, and a missing or different PNG fails the job.
      # Recording happens only through the `update_snapshots` dispatch input.
      - name: "E2E: check the Linux baseline"
        id: baseline
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
          REF: ${{ github.ref }}
        run: |
          present=0
          if [ -d e2e/__screenshots__/linux ] &&
            [ -n "$(ls -A e2e/__screenshots__/linux 2>/dev/null)" ]; then
            present=1
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            echo "recording requested: ./task e2e will rewrite e2e/__screenshots__/linux"
            exit 0
          fi
          if [ "$present" = 1 ]; then
            exit 0
          fi
          case "$REF" in
            refs/tags/*|refs/heads/release/*)
              echo "::error::e2e/__screenshots__/linux is missing and $REF must compare against it."
              echo "::error::Record it deliberately on Linux with ./task e2e --update-snapshots, or dispatch this workflow with update_snapshots=true, then review and commit e2e/__screenshots__/linux/."
              exit 1
              ;;
          esac
          echo "::warning::no Linux visual baseline yet: the visual comparison is skipped on $REF so this run can pass."
          echo "::warning::Record it deliberately on Linux with ./task e2e --update-snapshots, then review and commit e2e/__screenshots__/linux/."
      - name: "E2E: run"
        env:
          PGPASSWORD: postgres
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
          BASELINE_PRESENT: ${{ steps.baseline.outputs.present }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            ./task e2e --update-snapshots
          elif [ "$BASELINE_PRESENT" = "1" ]; then
            ./task e2e
          else
            ./task e2e --grep-invert "@visual"
          fi
      - name: "E2E: upload a recorded baseline"
        if: always() && inputs.update_snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-linux-baseline
          path: e2e/__screenshots__/linux/
          if-no-files-found: error
      # QA-11: traces, failure screenshots, videos, the JSON report and the
      # HTML report all live under the config directory, which the runner would
      # otherwise delete with the job.
      - name: "E2E: upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            test-results/
          if-no-files-found: warn

  # QA-06: the nightly run owns the full manifest; this job runs the changed
  # prefixes on a pull request, so a new write path or access decision gets a
  # mutant without paying for the whole list on every push.
  mutation:
    name: "Mutation: changed modules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "Dependencies: install the runtime C libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre3
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Mutation: run the changed prefixes"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .cache-changed.txt
          status=0
          for prefix in apps/api/src/ modules/account/ modules/session/ \
                        modules/tournament/ modules/player/ modules/share/ \
                        modules/rating/ tools/parity/; do
            if grep -q "^$prefix" .cache-changed.txt; then
              echo "mutation: changed prefix $prefix"
              ./task mutation --only "$prefix" || status=1
            fi
          done
          rm -f .cache-changed.txt
          exit "$status"

  image:
    name: "Image: build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Image: build"
        env:
          COMMIT: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg APP_COMMIT="$COMMIT" -t majadu-api:ci .

  notify:
    name: "Notify: red main build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [gate]
    # Only a red push to main pages someone; a red pull request is already
    # visible to its author. The webhook is the same one majadu-alert@ posts to.
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: "Notify: post the failure"
        env:
          WEBHOOK: ${{ secrets.MAJADU_ALERT_WEBHOOK }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::MAJADU_ALERT_WEBHOOK is not configured; the red main build is only in GitHub"
            exit 0
          fi
          curl -fsS -m 10 -H "Content-Type: application/json" \
            --data "{\"text\":\"majadu: main CI failed at $SHA $RUN_URL\"}" \
            "$WEBHOOK"

  gate:
    name: "Gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [api-check, api-test, contract, supply-chain, web, e2e, mutation, image]
    if: always()
    steps:
      - name: "Gate: require every job"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # `mutation` is pull-request only; a push run treats it as skipped.
          echo "$NEEDS" | jq -e '
            to_entries | all(.[];
              .value.result == "success" or
              (.key == "mutation" and .value.result == "skipped"))'
