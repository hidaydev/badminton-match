name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # QA-03: recording a visual baseline is an explicit operator action, never a
  # branch that CI takes on its own when the Linux set is absent.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Record the Linux visual baseline instead of comparing it"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NIM_VERSION: "2.4.0"

jobs:
  api-check:
    name: "API: check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # QA-11: `./task check` runs the TypeScript coverage gate, so this job
      # needs the workspace installed as well as Nim.
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # D-6: `check` runs the database-backed suites, so this job provisions the
      # same disposable database the integration job uses.
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      - name: "API: check"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: ./task check

  api-test:
    name: "API: integration (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two shards of the sorted suite list. The list is split by position, so both
    # jobs run the same files every time, and each has its own database service
    # on its own runner. `./task test --timing` records per-suite wall time.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task test`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` only creates empty databases. The integration suites assume the
      # schema and the reference rows exist, so they run against a migrated
      # database, using the same dbtools path `./task dev` uses.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # TL-07: the import suite reads a v1 database and writes a v2 one, and it
      # skips itself when either DSN is unset. The source is the captured v1
      # schema plus the fixture the cases assert against; the target is a fresh
      # copy of the migrated database, so the suite never writes into bm2_dev.
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          # An empty source must not pass as a clean import: the cases compare
          # against rows in the bm schema, so a source without one fails here.
          loaded=$(psql -d "$IMPORT_SOURCE_DSN" -tAc "select to_regnamespace('bm')")
          if [ "$loaded" != "bm" ]; then
            echo "bm2_import_source_test has no bm schema" >&2
            exit 1
          fi
      - name: "API: test"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          SHARD: ${{ matrix.shard }}
        run: ./task test --timing --shard "$SHARD/2"
      - name: "API: timing report"
        if: always()
        run: |
          for f in .cache/*/timing/test.tsv; do
            [ -f "$f" ] || continue
            echo "== $f"
            sort -t"$(printf '\t')" -k2,2nr "$f" | head -10
          done

  contract:
    name: "Contract: generated files"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # Fails when the two source specs, the merged document, the generated Nim
      # routes, or the generated TS client no longer match
      # packages/contracts/openapi/CONTRACT.sha256. A spec edit must land with a
      # regenerated fingerprint so the contract change is reviewable.
      - name: "Contract: fingerprint and generated files must match the specs"
        run: ./task contract-check
      # Offline: both corpora are hashed against their MANIFEST.sha256 and every
      # case is linted against the generated routes. The recorded cases are the
      # only per-route behaviour record, so a fixture edit that skips the
      # manifest update fails here instead of on a replay.
      - name: "Parity: corpus manifest and lint"
        run: ./task parity verify && ./task parity v2 lint

  web:
    name: "Web: build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      - name: "Web: check"
        run: pnpm check:web
      - name: "Web: build"
        run: pnpm build:web
      - name: "Scoreboard: build"
        run: pnpm build:scoreboard
      # PWA-03: the scoreboard is the build used in the hall, and no gate
      # produced its installable artifact. Assert the service worker precache
      # covers the shell and the entry chunk the built index.html asks for.
      - name: "Scoreboard: assert the service worker precache"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dist = 'apps/scoreboard/dist';
          const sw = fs.readFileSync(`${dist}/sw.js`, 'utf8');
          const html = fs.readFileSync(`${dist}/index.html`, 'utf8');
          const script = html.match(/<script[^>]*\bsrc=["']([^"']+\.js)["']/);
          if (!script) throw new Error('apps/scoreboard/dist/index.html has no entry script');
          const entry = script[1].replace(/^\//, '');
          const urls = [...sw.matchAll(/["']?url["']?\s*:\s*["']([^"']+)["']/g)]
            .map((match) => match[1].replace(/^\//, ''));
          if (!urls.includes('index.html')) {
            throw new Error('apps/scoreboard/dist/sw.js precache has no /index.html');
          }
          if (!urls.includes(entry)) {
            throw new Error(`apps/scoreboard/dist/sw.js precache has no entry script ${entry}`);
          }
          console.log(`scoreboard precache ok: /index.html and ${entry}`);
          NODE

  e2e:
    name: "E2E: browser"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      - name: "E2E: install browsers"
        run: pnpm exec playwright install --with-deps
      # deps.lock also pins the coverage tools, and `./task deps-check` compares
      # the versions they report exactly. apt on the runner ships lcov 2.0 and
      # gcovr 7.0 against the locked 2.6 and 8.8, so both come from upstream.
      # The doc and XS targets are skipped: they need sphinx and a C++20 build
      # and contribute nothing to `lcov --version`.
      - name: "Dependencies: install pinned coverage tools"
        run: |
          python3 -m pip install --break-system-packages gcovr==8.8
          git clone --depth 1 --branch v2.6 \
            https://github.com/linux-test-project/lcov "$RUNNER_TEMP/lcov"
          sudo make -C "$RUNNER_TEMP/lcov" install LCOV_NO_DOC=1 LCOV_NO_XS=1
      # Printed for the log; `./task deps-check` below is what turns a version
      # that is not the exact pin in deps.lock into a failure.
      - name: "Dependencies: pinned coverage tool versions"
        run: |
          lcov --version
          gcovr --version
      - name: "Dependencies: installed content must match deps.lock"
        run: ./task deps-check
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `./task e2e` opens its database as the OS user, so the runner needs
          # a role. `PGPASSWORD` (set on the run step) supplies the password the
          # harness's passwordless DSN does not carry.
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      # Pixel baselines live in `e2e/__screenshots__/{platform}/`. Production is
      # Linux, so the Linux set must exist and be committed: CI compares it on
      # every run. A missing set is a failure, not an invitation to record one;
      # recording is only allowed through the `update_snapshots` dispatch input.
      - name: "E2E: require the Linux baseline"
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            echo "recording requested: ./task e2e will rewrite e2e/__screenshots__/linux"
            exit 0
          fi
          if [ ! -d e2e/__screenshots__/linux ]; then
            echo "::error::e2e/__screenshots__/linux is missing, so the visual gate cannot compare anything."
            echo "::error::Record it deliberately: run ./task e2e --update-snapshots on Linux, or dispatch this workflow with update_snapshots=true, then review and commit e2e/__screenshots__/linux/."
            exit 1
          fi
      - name: "E2E: run"
        env:
          PGPASSWORD: postgres
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            ./task e2e --update-snapshots
          else
            ./task e2e
          fi
      - name: "E2E: upload a recorded baseline"
        if: inputs.update_snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-linux-baseline
          path: e2e/__screenshots__/linux/
          if-no-files-found: error

  image:
    name: "Image: build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Image: build"
        env:
          COMMIT: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg APP_COMMIT="$COMMIT" -t majadu-api:ci .

  gate:
    name: "Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-check, api-test, contract, web, e2e, image]
    if: always()
    steps:
      - name: "Gate: require every job"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
