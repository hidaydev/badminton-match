# class: A
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  # QA-03: recording a visual baseline is an explicit operator action on a
  # Linux machine, never a branch CI takes when the set is absent, so the
  # dispatch trigger has no recording input.
  workflow_dispatch:

permissions:
  contents: read

# One run per commit within an event class. Pull requests group by head SHA, so
# two PR runs for the same commit dedupe; pushes and dispatch runs group by
# event and ref. A push and a PR for the same SHA therefore never share a group,
# so a PR run cannot cancel a strict release-push run. Only pull requests cancel
# a run in progress.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.head.sha) || format('{0}-{1}', github.event_name, github.ref) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIM_VERSION: "2.4.2"

# The runner image is pinned instead of `ubuntu-latest`. The `ubuntu-latest`
# label moved to Ubuntu 26 on 2026-10-19 and broke the pinned lcov build, so the
# workflows stay on the image the toolchain is validated against. Runtime C
# libraries and Perl modules are installed explicitly below rather than assumed.

jobs:
  api-check:
    name: "API: check"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W26: the cheap gate runs first; a failure there stops this job before it
    # starts. Three of the five red main runs since 5 Nov failed in exactly the
    # checks `preflight` now owns.
    needs: [preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # QA-11: `./task check` runs the TypeScript coverage gate, so this job
      # needs the workspace installed as well as Nim.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # QA-25: `check` is the database-free layer. Every suite that opens a
      # database lives under `tests/integration/` and runs in `api-test`, so
      # this job has no postgres service and no DSN.
      # QA-27: `--static` skips the suites too: `api-test` compiles and runs
      # every one of them, and a compile here would be a second pass over the
      # same tree in the same run. The web gates run in the `web` job.
      - name: "API: check"
        run: ./task check --static
      # QA-11: a red check leaves the per-suite JUnit report, the failure list
      # and the timing table on the runner; this makes them downloadable.
      - name: "API: upload failure reports"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-check-results
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  api-test:
    name: "API: integration (shard ${{ matrix.shard }}/2)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W26: waits for the cheap gate, and restores the nimble and nimcache entries
    # that `preflight` already warmed.
    needs: [preflight]
    # Two shards of the suite list. The split is planned against
    # task.d/test-costs.tsv (measured on this runner, written by
    # `./task test-costs`), so both jobs run the same files every time and the
    # slower shard stays inside the W8 ceiling; without the table it falls back
    # to a positional split. Each shard has its own database service on its own
    # runner. `./task test --timing` records per-suite wall time.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task test`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` only creates empty databases. The integration suites assume the
      # schema and the reference rows exist, so they run against a migrated
      # database, using the same dbtools path `./task dev` uses.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # TL-07: the import suite reads a v1 database and writes a v2 one, and it
      # skips itself when either DSN is unset. The source is the captured v1
      # schema plus the fixture the cases assert against; the target is a fresh
      # copy of the migrated database, so the suite never writes into bm2_dev.
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          # QA-10: the production-shaped fixture (104 players, 1,040 games)
          # has its own pair, because verify maps every source row into one
          # community.
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          # An empty source must not pass as a clean import: the cases compare
          # against rows in the bm schema, so a source without one fails here.
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "API: test"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
          SHARD: ${{ matrix.shard }}
        run: ./task test --timing --shard "$SHARD/2"
      - name: "API: timing report"
        if: always()
        run: |
          # W8 (QOUVER_CICD_STANDARD §11.2) is judged on the two shards' totals,
          # so each shard prints its own total and the WHOLE table, not the top
          # ten. A shard can only be balanced against costs that were recorded:
          # the ten-line summary cannot produce the cost table a cost-aware split
          # needs, and about a hundred suites never appeared in it.
          for f in .cache/*/timing/test.tsv; do
            [ -f "$f" ] || continue
            echo "== $f"
            awk -F'\t' '{ ms += $2 } END {
              printf "shard total: %d s across %d suite(s)\n", ms / 1000, NR }' "$f"
            sort -t"$(printf '\t')" -k2,2nr "$f"
          done
      # QA-11: JUnit, the machine-readable failure list and the timing table
      # from this shard, uploaded only when the shard fails.
      - name: "API: upload failure reports"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-results-${{ matrix.shard }}
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      # W8 (QOUVER_CICD_STANDARD §11.2) needs a per-suite cost table measured on
      # the runner, not on a laptop: the two differ by an order of magnitude for
      # the shell-heavy suites. The table is small, so every green run keeps one
      # and a cost-aware split can be built from real numbers instead of guesses.
      - name: "API: upload the shard timing table"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-timing-${{ matrix.shard }}
          path: .cache/*/timing/test.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  preflight:
    name: "Preflight: contract, docs, standard"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W26 (QOUVER_CICD_STANDARD §12.1): the cheap gate, in front of every
    # expensive job. It measured 81 s on main 75a029cb, against a run wall of
    # 653 s, so a failure here costs a minute instead of eleven. Three of the
    # five red main runs since 5 Nov failed in exactly these checks.
    #
    # `gate` is unchanged and still a fan-in at the end: `Gate` is the required
    # status check, and moving that name onto this job would let main merge on a
    # gate that only looked at the contract.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The compiler cache this job writes is the one every later job restores:
      # the contract check compiles tools/contract-gen/check.nim, and a warm
      # entry keeps the following jobs from paying for that tree again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # Fails when the two source specs, the merged document, the generated Nim
      # routes, or the generated TS client no longer match
      # packages/contracts/openapi/CONTRACT.sha256. A spec edit must land with a
      # regenerated fingerprint so the contract change is reviewable.
      - name: "Contract: fingerprint and generated files must match the specs"
        run: ./task contract-check
      # ISO-11: a quoted migration or operation count is a claim. Compare it with
      # the directory and CONTRACT.sha256 instead of maintaining a second copy.
      - name: "Docs: quoted counts match the artefacts"
        run: ./task docs-check
      # QOUVER_CICD_STANDARD §11: the static rules a pipeline cannot feel at run
      # time. W9 no cross-workflow poll in a Class A workflow, W10 Dependabot
      # guard, W11 one gate command per run, W19 pinning, W20 no `-latest`
      # runner, W22 artifact retention, W26 this job, plus the universal
      # contract (timeout, caching-independent job shape, deploy invariants).
      # Byte-identical copy of the standard's checker, so a refresh here is a
      # `cp` and a diff of nothing.
      - name: "CI standard: static rules"
        run: ./ops/scripts/cicd-standard-check.sh .

  contract:
    name: "Contract: corpora"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `./task parity` compiles tools/dbtools to lint every recorded case
      # against the generated routes, so this job keeps the Nim toolchain. The
      # first attempt at this split dropped it and failed in five seconds.
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # Offline: both corpora are hashed against their MANIFEST.sha256 and every
      # case is linted against the generated routes. The recorded cases are the
      # only per-route behaviour record, so a fixture edit that skips the
      # manifest update fails here instead of on a replay.
      - name: "Parity: corpus manifest and lint"
        run: ./task parity verify && ./task parity v2 lint

  supply-chain:
    name: "Supply chain: scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W26: the scanners are the second-cheapest gate; they start after the cheap
    # one rather than alongside a job that would fail on a drifted contract.
    needs: [preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commits in this run, not only the working tree.
          fetch-depth: 0
      # `./task osv-scan` compiles the severity gate (tools/osvgate), which is
      # stdlib only: no nimble packages are installed in this job.
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No pnpm cache here: the job audits the lockfile without installing, so
      # the store directory never exists and setup-node's post step failed the
      # job trying to save it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # A tag ref is mutable and a 41-character SHA is a different commit that
      # GitHub still resolves; the guard fails on both before the scanners run.
      - name: "Supply chain: every action is pinned to a 40-hex SHA"
        run: ./task ci-guards
      - name: "Supply chain: audit the frontend lockfile"
        run: pnpm audit --audit-level=high --prod
      # SEC-05: OSV is a second advisory database over the same lockfile, and it
      # reports the package, the version and the fixing release instead of only
      # an exit code. The scanner is a release asset pinned by version and by the
      # sha256 recorded in deps.lock; `./task deps-check` fails when this step
      # and the lock disagree.
      - name: "Supply chain: install the pinned OSV scanner"
        env:
          OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$OSV_URL"
          printf '%s  %s\n' "$OSV_SHA256" "$RUNNER_TEMP/osv-scanner" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
      - name: "Supply chain: scan the lockfile against OSV"
        run: ./task osv-scan
      - name: "Supply chain: scan for committed secrets"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITLEAKS: the action above scans `--no-merges --first-parent base^..head`.
      # This branch is built from merges, so that range is a couple of commits
      # out of the whole graph and a secret that arrived inside a merged wave
      # branch sits outside it: the gate reports clean because it never looked.
      # The pinned CLI scans every commit reachable from every ref with the same
      # `.gitleaks.toml`, so the event shape cannot narrow the scan, and the
      # binary is cached because a cold download is the slow half.
      - name: "Supply chain: gitleaks binary cache"
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-gitleaks
          key: gitleaks-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "Supply chain: install the pinned gitleaks"
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$GITLEAKS_URL"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cache/majadu-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$HOME/.cache/majadu-gitleaks" gitleaks
          "$HOME/.cache/majadu-gitleaks/gitleaks" version
      # Not conditional on the event and not `continue-on-error`: a finding in
      # the history fails the gate, and `./task secrets-history` treats an
      # inconclusive exit as a failure rather than a clean scan.
      - name: "Supply chain: scan the whole history for secrets"
        run: PATH="$HOME/.cache/majadu-gitleaks:$PATH" ./task secrets-history
      # Filesystem first: it sees dependency manifests and source even when the
      # image job cannot run. The image itself is scanned on every release.
      - name: "Supply chain: scan for vulnerable dependencies"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  web:
    name: "Web: build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W26: a contract or docs drift is cheaper to report than a full web build.
    needs: [preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      - name: "Web: check"
        run: pnpm check:web
      - name: "Web: build"
        run: pnpm build:web
      - name: "Scoreboard: build"
        run: pnpm build:scoreboard
      # PWA-03: the scoreboard is the build used in the hall, and no gate
      # produced its installable artifact. The target asserts the service worker
      # precache covers the shell and the entry chunk built index.html asks for.
      - name: "Scoreboard: assert the service worker precache"
        run: ./task scoreboard-pwa
      # QA-11: a failed Vitest run leaves the coverage report and the failure
      # output; without the upload the runner deletes it.
      - name: "Web: upload failure reports"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results
          path: |
            apps/web/coverage/
            apps/web/test-results/
            apps/scoreboard/coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: "E2E: browser"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W10 (QOUVER_CICD_STANDARD §11.2): a Dependabot PR proves that a dependency
    # bump still type-checks and passes the suites, not that the browser path in
    # a real Chromium works; it skips the browser suite. Push, schedule and
    # dispatch runs are untouched, and a human PR still runs it.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    # W26: the browser suite is the longest job in the run, so it is the one that
    # most needs a cheap gate in front of it.
    needs: [preflight]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      # Every pinned browser is downloaded, not just the two the suite runs:
      # `deps.lock` pins firefox as well and `./task deps-check` requires each
      # pinned browser to be installed, which a cold cache otherwise fails.
      - name: "E2E: install browsers"
        run: pnpm exec playwright install
      # The system libraries come from apt, and that is the step that has eaten
      # this job's budget three times: 14m24s on 2026-11-10 and 13m47s on
      # 2026-11-18, both cancelled at the cap before a single test ran. The
      # second one was `playwright install --with-deps` resolving Recommends:
      # 181 packages and 125 MB on a slow mirror. `./task browser-deps` installs
      # the same package set from the pinned list in e2e/system-deps.txt, with
      # each request bounded and the whole run capped, so a slow mirror fails in
      # this step rather than starving the suite. The .deb cache makes the
      # install repeatable: a cold run pays for the download once, and every
      # later run installs from these files with `--no-download` and never
      # opens a mirror.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-debs
          key: browser-debs-${{ runner.os }}-${{ hashFiles('e2e/system-deps.txt') }}
      - name: "E2E: system libraries"
        env:
          MAJADU_BROWSER_DEPS_CACHE: ${{ runner.temp }}/majadu-debs
        run: |
          mkdir -p "$MAJADU_BROWSER_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-debs/." "$MAJADU_BROWSER_DEPS_CACHE/" 2>/dev/null || true
          ./task browser-deps
          cp -a "$MAJADU_BROWSER_DEPS_CACHE/." "$HOME/.cache/majadu-debs/" 2>/dev/null || true
      # Separate from the install so a red run says which half broke: a browser
      # that will not start names the missing shared library, and a wasted
      # cache says so in its own sentence. The 15-minute cap is unchanged.
      - name: "E2E: browsers start"
        run: ./task browser-check
      # deps.lock also pins the coverage tools, and `./task deps-check` compares
      # the versions they report exactly. apt on the runner ships lcov 2.0 and
      # gcovr 7.0 against the locked 2.6 and 8.8, so both come from upstream.
      # `./task coverage-tools` keeps the lcov tree and the gcovr wheel set in a
      # cache key: a cold key clones and downloads once, a warm one copies files
      # and never opens the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-coverage-tools
          key: coverage-tools-${{ runner.os }}-lcov2.6-gcovr8.8
      - name: "Dependencies: install pinned coverage tools"
        env:
          MAJADU_COVERAGE_TOOLS_CACHE: ${{ runner.temp }}/majadu-coverage-tools
        run: |
          mkdir -p "$MAJADU_COVERAGE_TOOLS_CACHE"
          cp -a "$HOME/.cache/majadu-coverage-tools/." "$MAJADU_COVERAGE_TOOLS_CACHE/" 2>/dev/null || true
          ./task coverage-tools
          cp -a "$MAJADU_COVERAGE_TOOLS_CACHE/." "$HOME/.cache/majadu-coverage-tools/" 2>/dev/null || true
      # Printed for the log; `./task deps-check` below is what turns a version
      # that is not the exact pin in deps.lock into a failure.
      - name: "Dependencies: pinned coverage tool versions"
        run: |
          lcov --version
          gcovr --version
      - name: "Dependencies: installed content must match deps.lock"
        run: ./task deps-check
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `./task e2e` opens its database as the OS user, so the runner needs
          # a role. `PGPASSWORD` (set on the run step) supplies the password the
          # harness's passwordless DSN does not carry.
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      # Pixel baselines live in `e2e/__screenshots__/{platform}/` and CI only
      # compares them. The Linux set is committed, so a missing or empty
      # directory is a deleted baseline and fails, not a reason to record a new
      # one: a run that records its own baseline proves only that it is
      # consistent with itself.
      - name: "E2E: require the Linux baseline"
        run: |
          if [ ! -d e2e/__screenshots__/linux ] ||
            [ -z "$(ls -A e2e/__screenshots__/linux 2>/dev/null)" ]; then
            echo "::error::e2e/__screenshots__/linux is missing or empty; it is committed and must be reviewed with the change."
            echo "::error::Record it deliberately on a Linux machine (see e2e/README.md) and commit the set."
            exit 1
          fi
      - name: "E2E: run"
        env:
          PGPASSWORD: postgres
        run: ./task e2e
      # QA-11: traces, failure screenshots, videos, the JSON report and the
      # HTML report all live under the config directory, which the runner would
      # otherwise delete with the job.
      - name: "E2E: upload failure artifacts"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # QA-06: the nightly run owns the full manifest; this job runs the changed
  # prefixes on a pull request, so a new write path or access decision gets a
  # mutant without paying for the whole list on every push.
  mutation:
    name: "Mutation: changed modules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # W10: mutation tests answer "did the suite catch a changed write path", which
    # a dependency bump does not change. Pull-request only either way; a Dependabot
    # PR skips it and the gate accepts the skip for that actor alone.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@efd7b4f2cab6441597916438c4f03425167d453b # v2.4.0
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Mutation: run the changed prefixes"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > .cache-changed.txt
          status=0
          for prefix in apps/api/src/ modules/account/ modules/session/ \
                        modules/tournament/ modules/player/ modules/share/ \
                        modules/rating/ tools/parity/; do
            if grep -q "^$prefix" .cache-changed.txt; then
              echo "mutation: changed prefix $prefix"
              ./task mutation --only "$prefix" || status=1
            fi
          done
          rm -f .cache-changed.txt
          exit "$status"
      # QA-11: a survivor is a finding, and the report that names it must outlive
      # the runner.
      - name: "Mutation: upload the run"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: .cache/*/mutation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  image:
    name: "Image: build"
    needs: [gate]
    # `always()` is what lets this job start at all: `gate` runs even when one of
    # its own needs was skipped (`mutation` on a push), and a job whose needs
    # chain contains a skip is skipped itself unless its own `if` overrides that.
    # The second half keeps the ordering promise: the image is published only
    # after the gate is green. W10 deliberately does NOT guard this job on
    # Dependabot: a `docker` ecosystem bump changes the base image, and building
    # it on the PR is the only proof that bump is good before main deploys it.
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # OPS-21: a push to main publishes the API image the host can pull, so every
    # commit on main has a signed image next to it and a hotfix does not have to
    # wait for a release tag to become pullable. `sha-<7>` names the commit and
    # `main` follows the branch head, exactly like the four other production
    # repos. The versioned `v<version>` tag stays the release workflow's own
    # artifact; this job never writes it, and a pull request builds the same
    # image with `push: false` so the PR check stays read-only.
    # `needs: [gate]` is what makes "published" mean "checks are green": the tag
    # appears after the gate, and the host waits for it instead of reading a
    # missing tag as "this half did not change".
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ${GITHUB_SHA::7} is bash syntax and `printf '%.7s'` matches the host's
      # `cut -c1-7`; `rev-parse --short` can return a different length.
      - name: "Image: short commit"
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"
      - name: "Image: log in to GHCR"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: "Image: build once and push"
        id: push
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHORT: ${{ steps.short.outputs.sha7 }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg APP_COMMIT="$COMMIT" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            -t "$IMAGE:sha-$SHORT" .
          if [ "$PUBLISH" != "true" ]; then
            echo "not a push to main; the image was built and is not published"
            exit 0
          fi
          docker tag "$IMAGE:sha-$SHORT" "$IMAGE:main"
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SHORT")
          digest=${digest#*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE:sha-$SHORT@$digest"
      - name: "Image: install cosign"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The same key the release uses. A published digest without a signature is
      # only a registry write, so a missing key fails the job instead of leaving
      # an unsigned tag behind for the host to reject at deploy time.
      - name: "Image: sign the digest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not configured; the published image cannot be verified"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

  notify:
    name: "Notify: red main build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [gate]
    # Only a red push to main pages someone; a red pull request is already
    # visible to its author. The webhook is the same one majadu-alert@ posts to.
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: "Notify: post the failure"
        env:
          WEBHOOK: ${{ secrets.MAJADU_ALERT_WEBHOOK }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::MAJADU_ALERT_WEBHOOK is not configured; the red main build is only in GitHub"
            exit 0
          fi
          curl -fsS -m 10 -H "Content-Type: application/json" \
            --data "{\"text\":\"majadu: main CI failed at $SHA $RUN_URL\"}" \
            "$WEBHOOK"

  # W9 (QOUVER_CICD_STANDARD §11.2): a job that waits on another workflow's run
  # does not live in a Class A workflow. The poll this replaced could hold the CI
  # wall for 12 minutes and turned a green CI red whenever the other workflow was
  # slow. The instrumented coverage graph was removed on 2026-11-20 (no other
  # repository carries one), so the gate now depends on in-repo jobs only.

  gate:
    name: "Gate"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only the in-repo quality jobs. `image` waits for this job instead of the other
    # way round, so a tag is published only for a commit whose checks are green.
    needs: [preflight, api-check, api-test, contract, supply-chain, web, e2e, mutation]
    if: always()
    steps:
      - name: "Gate: require every job"
        env:
          NEEDS: ${{ toJSON(needs) }}
          # W10: the gate accepts a skipped `e2e` only for the actor that is
          # allowed to skip it, so a job that disappears for any other reason
          # still reddens the gate.
          DEPENDABOT: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && '1' || '0' }}
        run: |
          echo "$NEEDS"
          # `mutation` is pull-request only; a push run treats it as skipped.
          echo "$NEEDS" | jq -e --arg dep "$DEPENDABOT" '
            to_entries | all(.[];
              .value.result == "success" or
              (.key == "mutation" and .value.result == "skipped") or
              ($dep == "1" and .key == "e2e" and .value.result == "skipped"))'
