# Release pipeline: triggered by a `v*` tag created and signed by `./task release`.
#
# Required secrets: none beyond the built-in GITHUB_TOKEN.
#   - packages: write (image job)    -> push ghcr.io/<owner>/<repo>:<tag>
#   - contents: write (publish job)  -> create the GitHub Release
# If the organisation blocks GITHUB_TOKEN writes to GHCR, add a classic PAT named
# GHCR_TOKEN with `write:packages` and use it for GHCR_TOKEN in the image job.
#
# Ordering (TECH-SPEC 8.1): `./task release` pushes the tag first, waits for this
# run to publish the image digest, and only then pushes `main`. A red run here
# therefore leaves production untouched. This workflow never creates or moves a
# tag; the tag always comes from the operator's signed `git tag -s`.
#
# The front end is part of the release gate (QA-02): the web job type checks,
# tests and builds both apps, and the e2e job drives the built web bundle. No
# job repeats another job's command: `./task ci` covers the Nim suites, coverage
# re-runs them instrumented against the committed baseline, and e2e and parity
# boot the API they drive. Each job keeps the repository's 15-minute cap and its
# own cache.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NIM_VERSION: "2.4.0"

jobs:
  verify:
    name: "Release: verify tag"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The gate is `./task ci`, not `./task check`: a release must also pass the
    # integration suites and the contract fingerprint, and those need a
    # database. The same service and provisioning steps as `ci.yml`. The web,
    # e2e, coverage, mutation and parity jobs below complete the release gate;
    # `image` depends on all of them, so any red job stops the artifact. The
    # 15-minute cap is the repository's contract; a tag that cannot finish
    # inside it fails closed (the image is never built, `main` is not pushed).
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "Release: tag is SSH-signed"
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/allowed_signers ]; then
            git config gpg.format ssh
            git config gpg.ssh.allowedSignersFile "$PWD/.github/allowed_signers"
            git verify-tag "$TAG"
            echo "signature verified with .github/allowed_signers"
            exit 0
          fi
          # No committed allowed_signers yet: GitHub verifies the SSH signature
          # against the signing keys registered on the account.
          sha=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          verified=$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.verified')
          reason=$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.reason')
          signature=$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.signature // ""')
          case "$signature" in
            "-----BEGIN SSH SIGNATURE-----"*) ;;
            *)
              echo "::error::tag $TAG is not SSH-signed; create it with git tag -s"
              exit 1
              ;;
          esac
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub did not verify the tag signature (reason: $reason)"
            echo "::error::register the signing key as an SSH signing key on the account"
            exit 1
          fi
      - name: "Release: tag matches VERSION"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(git show "$TAG:VERSION" | tr -d '[:space:]')
          expected=${TAG#v}
          if [ "$version" != "$expected" ]; then
            echo "::error::VERSION is '$version' but the tag says '$expected'"
            exit 1
          fi
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Release: install pinned deps"
        run: ./task deps-install
      - name: "Release: every action is pinned to a 40-hex SHA"
        run: ./task ci-guards
      # OPS-15: the RC branch rewrites the SPA to /majadu-rc. A tag that still
      # carries that line would ship production against the RC API, so the tag
      # fails before the image is built.
      - name: "Release: the SPA must not rewrite to the RC API"
        run: ./task ci-guards --release
      - name: "Release: database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task ci`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` creates empty databases; the integration suites assume the
      # schema and the reference rows exist.
      - name: "Release: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # SQ-17: the import and ratingingest suites are the two heaviest tools in
      # the tree, and a missing DSN makes them exit 77. `./task test` fails an
      # undocumented skip, but the release must also give them the databases
      # they need instead of tripping that failure. The source is the captured
      # v1 schema plus its fixture; the target is a fresh copy of the migrated
      # database.
      - name: "Release: provision the v1 import source and targets"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "Release: gate"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: ./task ci

  web:
    name: "Release: web"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      # QA-02: `./task ci` skips the TypeScript half, so the release gate runs
      # it here. `pnpm check:web` is tsc plus vitest for both front-end apps.
      - name: "Web: check"
        run: pnpm check:web
      - name: "Web: build"
        run: pnpm build:web
      # PWA-03: the scoreboard is the build used in the hall, so a release must
      # produce it and prove its service worker precaches the shell.
      - name: "Scoreboard: build"
        run: pnpm build:scoreboard
      - name: "Scoreboard: assert the service worker precache"
        run: ./task scoreboard-pwa

  e2e:
    name: "Release: e2e"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      - name: "E2E: install browsers"
        run: pnpm exec playwright install --with-deps
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      # QA-03: production is Linux and the Linux visual baseline has to be
      # committed and non-empty. A missing set fails here with the command that
      # records it; it is never recorded from a tag build.
      - name: "E2E: require the Linux baseline"
        run: |
          present=0
          if [ -d e2e/__screenshots__/linux ] &&
            [ -n "$(ls -A e2e/__screenshots__/linux 2>/dev/null)" ]; then
            present=1
          fi
          if [ "$present" = 0 ]; then
            echo "::error::e2e/__screenshots__/linux is missing or empty and a tag must compare against it."
            echo "::error::Record it deliberately on a Linux machine (see e2e/README.md), review it and commit e2e/__screenshots__/linux/."
            exit 1
          fi
      - name: "E2E: run"
        env:
          PGPASSWORD: postgres
        run: ./task e2e

  coverage:
    name: "Release: coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Coverage: install gcov tooling"
        run: sudo apt-get update && sudo apt-get install -y lcov gcovr
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          loaded=$(psql -d "$IMPORT_SOURCE_DSN" -tAc "select to_regnamespace('bm')")
          if [ "$loaded" != "bm" ]; then
            echo "bm2_import_source_test has no bm schema" >&2
            exit 1
          fi
      - name: "Coverage: measure against the baseline"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
        run: ./task coverage

  mutation:
    name: "Release: mutation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Mutation: every mutant is killed or allowlisted"
        run: ./task mutation

  parity:
    name: "Release: parity"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision the parity database"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_verify_test OWNER bm2_owner"
      # QA-02: the v2 corpus is replayed end to end on the tagged tree. The PR
      # job only lints it, so this is the release's own parity evidence.
      - name: "Parity: v2 verify"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_verify_test
        run: ./task parity v2 verify

  image:
    name: "Release: image"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [verify, web, e2e, coverage, mutation, parity]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: "Image: log in to GHCR"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: "Image: build once and push"
        id: push
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile \
            --build-arg APP_VERSION="${TAG#v}" \
            --build-arg APP_COMMIT="$COMMIT" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          digest=${digest#*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE@$digest"
      # The digest is only as trustworthy as the job that produced it. The
      # signature is what deploy-vps.sh verifies with the public key installed
      # next to the env files; without it a registry write is enough to move
      # production.
      - name: "Image: sign the digest"
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not configured; the release cannot be verified"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

  publish:
    name: "Release: GitHub Release"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [verify, image]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Release: log in to GHCR for the SBOM pull"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # SEC-05: the SBOM is CycloneDX, the format the consumer tools read, and it
      # is generated from the published digest so the bill of materials describes
      # the bytes production pulls, not the working tree.
      - name: "Release: generate the image SBOM"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          format: cyclonedx-json
          output-file: majadu.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # The image holds the OS packages and the binary; the dependency universe
      # the lockfiles pin is only visible from the checkout. Both documents are
      # CycloneDX so one consumer can read them.
      - name: "Release: generate the lockfile SBOM"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: majadu.deps.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "Release: create or update"
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(mktemp)
          git tag -l --format='%(contents)' "$TAG" >"$notes"
          # deploy-vps.sh accepts exactly one digest-shaped string in the
          # release body. A tag message that already contains one would make the
          # published body ambiguous, so the release fails here instead.
          if grep -qE 'sha256:[0-9a-f]{64}' "$notes"; then
            echo "::error::tag $TAG message contains a digest-shaped string; the release body must carry exactly one digest: line"
            exit 1
          fi
          {
            echo
            echo "## Container image"
            echo
            echo "- image: \`$IMAGE:$TAG\`"
            echo
            echo "digest: $DIGEST"
            echo
            echo "Verify the signature before pulling:"
            echo
            echo '```sh'
            echo "cosign verify --key cosign.pub \"\$IMAGE@\$DIGEST\""
            echo '```'
          } >>"$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
          fi
          gh release upload "$TAG" majadu.image.cdx.json majadu.deps.cdx.json --clobber
