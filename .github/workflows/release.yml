# class: B
# Release pipeline: triggered by a `v*` tag created and signed by `./task release`.
#
# Required secrets: none beyond the built-in GITHUB_TOKEN.
#   - packages: write (image job)    -> push ghcr.io/<owner>/<repo>:<tag>
#   - contents: write (publish job)  -> create the GitHub Release
# If the organisation blocks GITHUB_TOKEN writes to GHCR, add a classic PAT named
# GHCR_TOKEN with `write:packages` and use it for GHCR_TOKEN in the image job.
#
# Ordering (TECH-SPEC 8.1): `./task release` pushes the tag first, waits for this
# run to publish the image digest, and only then pushes `main`. A red run here
# therefore leaves production untouched. This workflow never creates or moves a
# tag; the tag always comes from the operator's signed `git tag -s`.
#
# The front end is part of the release gate (QA-02): the web job type checks,
# tests and builds both apps, and the e2e job drives the built web bundle. No
# job repeats another job's command: `./task ci` covers the Nim suites, and e2e
# and parity boot the API they drive. Each job keeps the repository's 15-minute
# cap and its own cache.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release run judges a tag, so a second run on the same tag must never cancel
# the one whose digest `./task release` is waiting for.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NIM_VERSION: "2.4.2"

jobs:
  # The tag gate. It reads the checkout and the API, so it finishes in seconds
  # and the slow jobs below run beside it instead of behind it: one serial job
  # for the whole suite hit the 15-minute cap on 2026-11-16 (run 43831303902)
  # with every test that ran green, and a cap that fails a healthy tree is not a
  # gate. Splitting the work is the fix; the cap, the suite list and the skip
  # allowlist are unchanged.
  tag-integrity:
    name: "Release: tag integrity"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # SEC-03: the signature is only worth what the key list behind it is
      # worth. `.github/allowed_signers` is that list, and it is committed, so
      # the signer is a reviewed decision rather than "any key on the
      # maintainer account". The step fails closed instead of falling back to
      # the GitHub API: a release whose trust anchor is missing is not a release
      # this repository can vouch for.
      - name: "Release: tag is SSH-signed"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          signers="$PWD/.github/allowed_signers"
          if [ ! -f "$signers" ]; then
            echo "::error::.github/allowed_signers is missing; the release has no committed trust anchor"
            echo "::error::commit the release signing public key (one '<email> ssh-ed25519 AAAA...' line) and tag again with git tag -s"
            exit 1
          fi
          if ! grep -qvE '^[[:space:]]*(#|$)' "$signers"; then
            echo "::error::.github/allowed_signers has no key line; the signature cannot be verified against it"
            exit 1
          fi
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$signers"
          git verify-tag "$TAG"
          echo "signature verified with .github/allowed_signers"
      # QA-04: the tag must be a commit the gate actually ran on. A release
      # branch that diverged from main carries a merge at tag time that no CI
      # run covered, so the tag refuses a tree that does not contain main.
      - name: "Release: the tag contains main"
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::the tagged commit does not contain origin/main"
            echo "::error::merge main into the release branch, run the full gate on the merge and tag that commit"
            exit 1
          fi
          echo "tag contains $(git rev-parse --short origin/main)"
      - name: "Release: tag matches VERSION"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(git show "$TAG:VERSION" | tr -d '[:space:]')
          expected=${TAG#v}
          if [ "$version" != "$expected" ]; then
            echo "::error::VERSION is '$version' but the tag says '$expected'"
            exit 1
          fi

  # The database-free half of the old single `verify` job, split the way
  # `ci.yml` splits it: `api-check` runs `--static` and `api-test` is the job
  # that compiles and runs every suite, so no tree is compiled twice. The union
  # of `static` and `test` is exactly the work `./task ci` did here.
  static:
    name: "Release: static"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Release: install pinned deps"
        run: ./task deps-install
      # QA-25: the static gates need no database. `--static` skips compiling the
      # suites because `test` compiles and runs them in the shards below.
      - name: "Release: static gates"
        run: ./task check --static
      - name: "Release: build"
        run: ./task build
      - name: "Release: every action is pinned to a 40-hex SHA"
        run: ./task ci-guards
      # OPS-15: the RC branch rewrote the SPA to /majadu-rc. The instance is
      # purged (2026-11-21), but a tag that carried that line would still ship a
      # SPA pointing at a hostname nothing serves, so the tag fails first.
      - name: "Release: the SPA must not rewrite to the RC API"
        run: ./task ci-guards --release
      - name: "Release: contract fingerprint"
        run: ./task contract-check
      # OPS-25: the mechanical docs claims and the release order are part of the
      # gate, so a sentence that contradicts the configuration fails here instead
      # of on the next incident.
      - name: "Release: docs claims"
        run: ./task docs-check

  # The suite half, sharded exactly as `ci.yml` shards it: the sorted suite list
  # is split against the measured cost table, each shard gets its own database
  # service on its own runner, and `./task test --timing` records per-suite wall
  # time. No suite is skipped and the allowlist is empty, so a shard that cannot
  # run its slice fails the release.
  test:
    name: "Release: test shard ${{ matrix.shard }} of 4"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # OPS-19: a warm run reuses the compiler cache instead of rebuilding the
      # whole Nim tree. The key carries the sources, so a changed file gets a
      # fresh cache and restore-keys supplies the unchanged remainder.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision and create the test database"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task test`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` creates empty databases; the integration suites assume the
      # schema and the reference rows exist.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # SQ-17: the import and ratingingest suites are the two heaviest tools in
      # the tree, and a missing DSN makes them exit 77. `./task test` fails an
      # undocumented skip, but the release must also give them the databases
      # they need instead of tripping that failure. The source is the captured
      # v1 schema plus its fixture; the target is a fresh copy of the migrated
      # database.
      - name: "Import: provision the v1 source and targets"
        env:
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "Release: test this shard"
        env:
          SHARD: ${{ matrix.shard }}
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: ./task test --timing --shard "$SHARD/4"
      - name: "Release: timing report"
        if: always()
        run: |
          for f in .cache/*/timing/test.tsv; do
            [ -f "$f" ] || continue
            echo "== $f"
            sort -t"$(printf '\t')" -k2,2nr "$f" | head -10
          done
      # QA-11: JUnit, the machine-readable failure list and the timing table
      # from this shard, uploaded only when the shard fails.
      - name: "Release: upload this shard's failure reports"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-results-${{ matrix.shard }}
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  web:
    name: "Release: web"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: "Web: install"
        run: pnpm install --frozen-lockfile
      # QA-02: `./task ci` skips the TypeScript half, so the release gate runs
      # it here. `pnpm check:web` is tsc plus vitest for both front-end apps.
      - name: "Web: check"
        run: pnpm check:web
      - name: "Web: build"
        run: pnpm build:web
      # PWA-03: the scoreboard is the build used in the hall, so a release must
      # produce it and prove its service worker precaches the shell.
      - name: "Scoreboard: build"
        run: pnpm build:scoreboard
      - name: "Scoreboard: assert the service worker precache"
        run: ./task scoreboard-pwa

  e2e:
    name: "Release: e2e"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      # The system libraries come from the pinned list in e2e/system-deps.txt
      # through `./task browser-deps`, never from `install --with-deps`: that
      # call let apt resolve Recommends: and spent 13m47s of a 15-minute job on
      # 2026-11-18 before the cap cancelled it. Every pinned browser is still
      # downloaded, not just the two the suite runs, because `deps.lock` pins
      # firefox as well and a cold cache has to produce all of them.
      - name: "E2E: install browsers"
        run: pnpm exec playwright install
      # Each apt invocation is capped inside the target, so a stalled mirror ends
      # this step with its own message instead of eating the job's budget. The
      # .deb cache lets a repeat run install from disk without a mirror.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-debs
          key: browser-debs-${{ runner.os }}-${{ hashFiles('e2e/system-deps.txt') }}
      - name: "E2E: system libraries"
        env:
          MAJADU_BROWSER_DEPS_CACHE: ${{ runner.temp }}/majadu-debs
        run: |
          mkdir -p "$MAJADU_BROWSER_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-debs/." "$MAJADU_BROWSER_DEPS_CACHE/" 2>/dev/null || true
          ./task browser-deps
          cp -a "$MAJADU_BROWSER_DEPS_CACHE/." "$HOME/.cache/majadu-debs/" 2>/dev/null || true
      # A browser that will not start names the missing shared library, so a red
      # release run says why before the suite is attempted.
      - name: "E2E: browsers start"
        run: ./task browser-check
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      # QA-03: production is Linux and the Linux visual baseline has to be
      # committed and non-empty. A missing set fails here with the command that
      # records it; it is never recorded from a tag build.
      - name: "E2E: require the Linux baseline"
        run: |
          present=0
          if [ -d e2e/__screenshots__/linux ] &&
            [ -n "$(ls -A e2e/__screenshots__/linux 2>/dev/null)" ]; then
            present=1
          fi
          if [ "$present" = 0 ]; then
            echo "::error::e2e/__screenshots__/linux is missing or empty and a tag must compare against it."
            echo "::error::Record it deliberately on a Linux machine (see e2e/README.md), review it and commit e2e/__screenshots__/linux/."
            exit 1
          fi
      - name: "E2E: run"
        env:
          PGPASSWORD: postgres
        run: ./task e2e

  mutation:
    name: "Release: mutation"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Mutation: every mutant is killed or allowlisted"
        run: ./task mutation

  parity:
    name: "Release: parity"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision the parity database"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_verify_test OWNER bm2_owner"
      # QA-02: the v2 corpus is replayed end to end on the tagged tree. The PR
      # job only lints it, so this is the release's own parity evidence.
      - name: "Parity: v2 verify"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_verify_test
        run: ./task parity v2 verify

  image:
    name: "Release: image"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [tag-integrity, static, test, web, e2e, mutation, parity]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # REL-CI-07: every release rebuilt eight Nim binaries from cold, and the
      # job's own cap is 15 minutes, so a green tree could produce a red release
      # whose only remedy was a re-run. A buildx builder with a GHA layer cache
      # keeps the compile layers across runs. Only the API binary embeds
      # APP_COMMIT (`-d:appCommit` at apps/api/Dockerfile:49); the other seven
      # compile from sources alone, so a commit-only change reuses their layers
      # instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "Image: log in to GHCR"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: "Image: build once and push"
        id: push
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          # REL-CI-10: a red `image` job used to leave only the GitHub log, and
          # the compile of ten Nim binaries is exactly what it truncates. The
          # build output is kept in a file so the failure step can upload it.
          # `pipefail` keeps the build's exit code: `tee` alone would report 0.
          set -o pipefail
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -f apps/api/Dockerfile \
            --build-arg APP_VERSION="${TAG#v}" \
            --build-arg APP_COMMIT="$COMMIT" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            -t "$IMAGE:$TAG" . 2>&1 | tee "$RUNNER_TEMP/image-build.log"
          docker push "$IMAGE:$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          digest=${digest#*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE@$digest"
      # REL-CI-10: the build log, only when the job fails, with a short
      # retention. A green release uploads nothing.
      - name: "Image: upload the build log"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-build-log
          path: ${{ runner.temp }}/image-build.log
          if-no-files-found: warn
          retention-days: 7
      # The digest is only as trustworthy as the job that produced it. The
      # signature is what deploy-vps.sh verifies with the public key installed
      # next to the env files; without it a registry write is enough to move
      # production.
      - name: "Image: sign the digest"
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not configured; the release cannot be verified"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

  publish:
    name: "Release: GitHub Release"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [tag-integrity, image]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Release: log in to GHCR for the SBOM pull"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # SEC-05: the SBOM is CycloneDX, the format the consumer tools read, and it
      # is generated from the published digest so the bill of materials describes
      # the bytes production pulls, not the working tree.
      - name: "Release: generate the image SBOM"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          format: cyclonedx-json
          output-file: majadu.image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # The image holds the OS packages and the binary; the dependency universe
      # the lockfiles pin is only visible from the checkout. Both documents are
      # CycloneDX so one consumer can read them.
      - name: "Release: generate the lockfile SBOM"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: majadu.deps.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "Release: create or update"
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(mktemp)
          git tag -l --format='%(contents)' "$TAG" | \
            sed -e '/^-----BEGIN SSH SIGNATURE-----/,/^-----END SSH SIGNATURE-----/d' \
                -e '/^-----BEGIN PGP SIGNATURE-----/,/^-----END PGP SIGNATURE-----/d' >"$notes"
          # deploy-vps.sh accepts exactly one digest-shaped string in the
          # release body. A tag message that already contains one would make the
          # published body ambiguous, so the release fails here instead.
          if grep -qE 'sha256:[0-9a-f]{64}' "$notes"; then
            echo "::error::tag $TAG message contains a digest-shaped string; the release body must carry exactly one digest: line"
            exit 1
          fi
          {
            echo
            echo "## Verification"
            echo
            echo "- tagged commit: \`$BASE_SHA\`"
            echo "- tag contains main: yes (checked in \`Release: tag integrity\`)"
            echo
            echo "## Container image"
            echo
            echo "- image: \`$IMAGE:$TAG\`"
            echo
            echo "digest: $DIGEST"
            echo
            echo "Verify the signature before pulling:"
            echo
            echo '```sh'
            echo "cosign verify --key cosign.pub \"\$IMAGE@\$DIGEST\""
            echo '```'
          } >>"$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
          fi
          gh release upload "$TAG" majadu.image.cdx.json majadu.deps.cdx.json --clobber
      # REL-CI-10: the two SBOMs and the notes file are the evidence this job
      # produces, and a failure at `gh release upload` used to leave only the
      # log. Uploaded only when the job fails.
      - name: "Release: upload the release evidence"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publish-evidence
          path: |
            majadu.image.cdx.json
            majadu.deps.cdx.json
          if-no-files-found: warn
          retention-days: 7
