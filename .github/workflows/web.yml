name: Web Checks

on:
  push:
    paths: ["apps/web/**", ".github/workflows/**"]
  pull_request:
    paths: ["apps/web/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Check (types + lint + tailwind + regression)
        run: npm run check
