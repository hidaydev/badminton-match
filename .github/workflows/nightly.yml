# class: C
name: Nightly

# The gates a push cannot afford, on one timer: the full mutation manifest, the
# whole parity corpus, and a repeated e2e to catch order dependence.
#
# 2026-11-20: this file used to run a second full `./task ci` in one 15-minute
# job. `./task ci` is `check` + `build` + `test` + `contract-check` + `docs-check`
# with a release build, which measured 20 to 29 minutes per run on main, so the
# job was cancelled at the cap before producing a verdict in each of the last
# five runs (three cancelled, two failed). Every test in it already runs in
# `ci.yml` on every push, so the second copy only bought the nightly a red name.
# What is left is what a push does not do.

on:
  schedule:
    # 01:00 WIB, after the deploy window and before the working day.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One nightly run per ref; a manual dispatch queues behind it instead of cutting
# a full suite off halfway.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NIM_VERSION: "2.4.2"

jobs:
  # QA-05: line coverage cannot prove an assertion would fail, and this is the
  # one gate no push runs in full (`ci.yml` mutates only the changed prefixes).
  # It needs the toolchain and no database, so it owns a runner and its whole
  # 15 minutes.
  mutation:
    name: "Nightly: mutation (full manifest)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Mutation: every mutant is killed or allowlisted"
        run: ./task mutation
      - name: "Mutation: upload the run"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-mutation
          path: .cache/*/mutation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # QA-12: the v2 corpus is recorded by the code under test, so it is a change
  # detector, not an oracle. `verify` replays the whole corpus on a disposable
  # database; no push does that, so it stays here. The canary proves replay
  # rejects a deliberately wrong body: if the comparator ever stops comparing,
  # the canary stops being rejected and this job fails.
  parity:
    name: "Nightly: parity (canary and full replay)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision the template"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: ./task dev-db
      - name: "Parity: the canary must be rejected"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_canary_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_canary_test OWNER bm2_owner"
          ./task parity v2 canary
      - name: "Parity: v2 verify"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_verify_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_verify_test OWNER bm2_owner"
          ./task parity v2 verify
      - name: "Nightly: report the slowest suites"
        if: always()
        run: ./task flakereport

  # QA-20 / REL-QA-08: a test that passes once proves it passes in the order the
  # runner happened to choose. The e2e repeat covers the browser suites; this job
  # is the Nim half, which no push runs in both orders at all. `--order-check`
  # walks the list forward and back to front inside one invocation and fails when
  # a suite changes its result, so nothing depends on a report left behind by
  # another job.
  #
  # It is sharded for the same reason `api-test` is: the cost table measures
  # 1048 s serial, and two orderings of that does not fit one 15-minute cap.
  # Every shard keeps its own database service, as in `ci.yml`.
  order-check:
    name: "Nightly: order dependence (shard ${{ matrix.shard }}/4)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # Same key as `api-test`, so the nightly reuses the compiler cache a push
      # already warmed instead of rebuilding the tree twice a day.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/*/check
            .cache/*/build
          key: nimcache-${{ runner.os }}-${{ hashFiles('deps.lock', 'config.nims', 'majadu.nimble', 'apps/**/*.nim', 'modules/**/*.nim', 'shared/**/*.nim', 'tools/**/*.nim') }}
          restore-keys: |
            nimcache-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      # The same provisioning `api-test` does, because a shard runs the same
      # list: one migrated database plus the databases the import suites read.
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # QA-20: a shard runs the same suite list `api-test` runs, so the import
      # suite is in it. Without these four DSNs that suite exits 77 and the
      # runner fails the job as an undocumented skip, which is what this job
      # did every night since the allowlist was emptied (SQ-17).
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
      - name: "Order check: forward and reversed in one run"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
          # Golden contract: the matrix value arrives as an env var, never
          # interpolated into this script.
          SHARD: ${{ matrix.shard }}
        run: ./task test --timing --order-check --shard "$SHARD/4"
      - name: "Order check: upload the verdicts"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-order-check
          path: |
            .cache/*/order-forward.tsv
            .cache/*/order-reverse.tsv
            .cache/*/failures.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # QA-20: repeating the functional and axe suites on a schedule is how timing
  # races are found before a release candidate finds them. The visual comparison
  # is excluded: it is a pixel baseline, not a flow, and repeating it would only
  # multiply the runtime.
  e2e-repeat:
    name: "Nightly: e2e repeat (flake watch)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: "2.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # W28 (QOUVER_CICD_STANDARD §12.2) / B-02: the packages are provisioned
      # once per cache key and installed from disk by every later job. The step
      # measured 30 to 44s per job across the last ten main runs, and 87 to 186s
      # when the mirror was slow (main 44478153535).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-runtime-debs
          key: runtime-debs-${{ runner.os }}-${{ hashFiles('ops/ci/runtime-packages.txt') }}
      - name: "Dependencies: install the runtime C libraries"
        env:
          MAJADU_RUNTIME_DEPS_CACHE: ${{ runner.temp }}/majadu-runtime-debs
        run: |
          mkdir -p "$MAJADU_RUNTIME_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-runtime-debs/." "$MAJADU_RUNTIME_DEPS_CACHE/" 2>/dev/null || true
          ./task runtime-deps
          cp -a "$MAJADU_RUNTIME_DEPS_CACHE/." "$HOME/.cache/majadu-runtime-debs/" 2>/dev/null || true
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      # Same rule as ci.yml: every pinned browser is downloaded, because
      # `./task deps-check` requires firefox to be present too, and the system
      # libraries come from the pinned list in e2e/system-deps.txt through
      # `./task browser-deps`, never from `install --with-deps`.
      - name: "E2E: install browsers"
        run: pnpm exec playwright install
      # A slow mirror has twice eaten this job's whole budget (14m24s on
      # 2026-11-10 and 13m47s on 2026-11-18, both cancelled at the cap before a
      # single test ran). The target caps the run, and the .deb cache lets a
      # repeat run install from disk without a mirror.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/majadu-debs
          key: browser-debs-${{ runner.os }}-${{ hashFiles('e2e/system-deps.txt') }}
      - name: "E2E: system libraries"
        env:
          MAJADU_BROWSER_DEPS_CACHE: ${{ runner.temp }}/majadu-debs
        run: |
          mkdir -p "$MAJADU_BROWSER_DEPS_CACHE"
          cp -a "$HOME/.cache/majadu-debs/." "$MAJADU_BROWSER_DEPS_CACHE/" 2>/dev/null || true
          ./task browser-deps
          cp -a "$MAJADU_BROWSER_DEPS_CACHE/." "$HOME/.cache/majadu-debs/" 2>/dev/null || true
      - name: "E2E: browsers start"
        run: ./task browser-check
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      - name: "E2E: repeat the functional and axe suites"
        env:
          PGPASSWORD: postgres
        run: ./task e2e --repeat-each=3 --grep-invert "@visual"
      - name: "Nightly: report the slowest browser specs"
        if: always()
        run: ./task flakereport
      - name: "Nightly: upload the repeat results"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-repeat
          path: |
            apps/web/test-results/
            .cache/*/timing/*.tsv
          if-no-files-found: warn
          retention-days: 30

  # SEC-05: CI scans the lockfile on every push. A security advisory is published
  # on its own schedule, so a tree nobody touched can become vulnerable while
  # every run stays green. The scheduled run is what notices that.
  supply-chain:
    name: "Nightly: advisories"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `./task osv-scan` compiles the severity gate (tools/osvgate), which is
      # stdlib only: no nimble packages are installed in this job.
      - uses: jiro4989/setup-nim-action@08957181dc5baf5f8446497598f798020a03e66a # v2.5.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: "Supply chain: audit the frontend lockfile"
        run: pnpm audit --audit-level=high --prod
      # Same pin as ci.yml: the sha256 is recorded in deps.lock (`release:`
      # scheme) and `./task deps-check` fails when the two disagree.
      - name: "Supply chain: install the pinned OSV scanner"
        env:
          OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$OSV_URL"
          printf '%s  %s\n' "$OSV_SHA256" "$RUNNER_TEMP/osv-scanner" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
      - name: "Supply chain: scan the lockfile against OSV"
        run: ./task osv-scan

  notify:
    name: "Notify: red nightly"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [mutation, parity, order-check, e2e-repeat, supply-chain]
    # REL-CI-04: `failure()` is false for a job the 15-minute cap cancelled, so
    # three of the last five nightlies died without paging anyone and the
    # mutation manifest could stay broken behind a red list. A cancelled nightly
    # is exactly the case this notify exists for.
    if: failure() || cancelled()
    steps:
      - name: "Notify: post the failure"
        env:
          WEBHOOK: ${{ secrets.MAJADU_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::MAJADU_ALERT_WEBHOOK is not configured; the red nightly is only in GitHub"
            exit 0
          fi
          curl -fsS -m 10 -H "Content-Type: application/json" \
            --data "{\"text\":\"majadu: nightly failed $RUN_URL\"}" \
            "$WEBHOOK"
