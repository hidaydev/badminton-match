name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIM_VERSION: "2.4.0"

jobs:
  full:
    name: "Nightly: full suite"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: "2.4.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      # The packages in deps.lock are not vendored: a cold `~/.nimble` cache
      # must install them before anything compiles.
      # Nim's `re` binds to the system PCRE 1 library at run time, and the
      # runner image does not ship it.
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - name: "Database: provision and create the test database"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          # `dev-db` only creates bm2_dev and bm2_template, and `./task ci`
          # refuses a DSN whose database name does not contain "test".
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bm2_test OWNER bm2_owner'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'bm2_test') \gexec
          SQL
      # `dev-db` only creates empty databases; `./task ci` runs the integration
      # suites, so they need the schema and the reference rows.
      - name: "Database: migrate and seed"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
        run: |
          mkdir -p .cache/ci
          nim c --hints:off -d:release -o:.cache/ci/dbtools tools/dbtools/main.nim
          .cache/ci/dbtools migrate --dir db/migrations
          .cache/ci/dbtools seed --dir db/seeds
      # TL-07: `./task ci` runs the import suite, which now refuses to skip
      # (QA-10). The source is the captured v1 schema plus the small fixture
      # and the production-shaped fixture, each with its own migrated target.
      - name: "Import: provision the v1 source and the v2 target"
        env:
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          IMPORT_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_import_source_test" \
            -c "CREATE DATABASE bm2_import_target_test OWNER bm2_owner TEMPLATE bm2_test" \
            -c "CREATE DATABASE bm2_import_bulk_source_test" \
            -c "CREATE DATABASE bm2_import_bulk_target_test OWNER bm2_owner TEMPLATE bm2_test"
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$IMPORT_SOURCE_DSN" \
            -f ops/dev/v1/fixtures/v1-fixtures.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f ops/dev/v1/schema.sql
          psql -v ON_ERROR_STOP=1 -q -d "$BULK_SOURCE_DSN" \
            -f testdata/import/production-shaped.sql
          # A source without the bm schema would import nothing and still read
          # as clean, so the job fails before the suite can run.
          for dsn in "$IMPORT_SOURCE_DSN" "$BULK_SOURCE_DSN"; do
            loaded=$(psql -d "$dsn" -tAc "select to_regnamespace('bm')")
            if [ "$loaded" != "bm" ]; then
              echo "$dsn has no bm schema" >&2
              exit 1
            fi
          done
      - name: "Nightly: full"
        env:
          MAJADU_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_test
          MAJADU_IMPORT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_target_test
          MAJADU_IMPORT_TEST_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_source_test
          MAJADU_IMPORT_BULK_TARGET_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_target_test
          MAJADU_IMPORT_BULK_SOURCE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_import_bulk_source_test
        run: ./task ci
      # QA-05: line coverage cannot prove an assertion would fail. Mutation
      # testing is slow enough that it belongs in the nightly run, and a
      # survivor that is not allowlisted fails the job.
      - name: "Mutation: every mutant is killed or allowlisted"
        run: ./task mutation
      # QA-12: the v2 corpus is recorded by the code under test, so it is a
      # change detector, not an oracle. The canary proves replay rejects a body
      # that is deliberately wrong; if the comparator ever stops comparing, the
      # canary stops being rejected and the step fails.
      - name: "Parity: the canary must be rejected"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_canary_test
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_canary_test OWNER bm2_owner"
          ./task parity v2 canary
      # The full corpus replay on its own disposable database. This is the run
      # that would surface drift after a change; the PR job only lints.
      - name: "Parity: v2 verify"
        env:
          PARITY_V2_DSN: postgresql://postgres:postgres@127.0.0.1:5432/bm2_parity_verify_test
          MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bm2_parity_verify_test OWNER bm2_owner"
          ./task parity v2 verify
      # QA-11: the nightly log is not the only place a failure should land.
      # QA-20: the report is uploaded on every run, not only on failure, because
      # a flake is diagnosed by comparing durations across green runs.
      - name: "Nightly: report the slowest suites"
        if: always()
        run: ./task flakereport
      - name: "Nightly: upload test results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-results
          path: |
            .cache/*/failures.tsv
            .cache/*/junit/junit.xml
            .cache/*/timing/*.tsv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # QA-20: a test that passes once proves it passes in the order the runner
  # happened to choose. Repeating the functional and axe suites on a schedule is
  # how order dependence and timing races are found before a release candidate
  # finds them. The visual comparison is excluded: it is a pixel baseline, not a
  # flow, and repeating it would only multiply the runtime.
  e2e-repeat:
    name: "Nightly: e2e repeat (flake watch)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAJADU_PG_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: "2.4.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "Dependencies: install the runtime C libraries"
        run: |
          # A warm runner already has the package, and skipping apt is what
          # keeps a slow mirror from spending this job's budget: on 2026-11-10 a
          # coverage shard sat in this step for fourteen minutes, past its cap,
          # with nothing to install. When it is missing, each request is bounded
          # so a stalled mirror fails fast and names itself instead.
          if ! dpkg -s libpcre3 >/dev/null 2>&1; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15)
            sudo apt-get update "${apt_opts[@]}"
            sudo apt-get install -y "${apt_opts[@]}" libpcre3
          fi
      - name: "Dependencies: install pinned Nim packages"
        run: ./task deps-install
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deps.lock') }}
      - name: "E2E: install"
        run: pnpm install --frozen-lockfile
      # Same rule as ci.yml: every pinned browser is downloaded, because
      # `./task deps-check` requires firefox to be present too, and apt is paid
      # only when one of the two engines the suite drives cannot start.
      - name: "E2E: install browsers"
        run: |
          # The system libraries come from apt, and a slow mirror has twice
          # eaten this job's whole budget (14m24s on 2026-11-10, cancelled at
          # the cap before a single test ran). Each request is bounded so a
          # stalled mirror fails over or fails fast and names itself.
          printf 'Acquire::http::Timeout "15";\nAcquire::Retries "3";\n' |
            sudo tee /etc/apt/apt.conf.d/99-majadu-timeout >/dev/null
          pnpm exec playwright install
          if ! pnpm --filter badminton-pair-tmp exec node -e \
            "const {chromium,webkit}=require('playwright');(async()=>{for(const engine of [chromium,webkit]){const browser=await engine.launch();await browser.close()}})()"; then
            echo "a cached browser could not start; installing the system dependencies"
            pnpm exec playwright install --with-deps
          fi
      - name: "Database: provision"
        env:
          MAJADU_DEV_ENV: ${{ runner.temp }}/dev.env
        run: |
          ./task dev-db
          psql "$MAJADU_PG_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$(whoami)\" LOGIN SUPERUSER PASSWORD 'postgres'"
      - name: "E2E: repeat the functional and axe suites"
        env:
          PGPASSWORD: postgres
        run: ./task e2e --repeat-each=3 --grep-invert "@visual"
      - name: "Nightly: report the slowest browser specs"
        if: always()
        run: ./task flakereport
      - name: "Nightly: upload the repeat results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-repeat
          path: |
            apps/web/test-results/
            .cache/*/timing/*.tsv
          if-no-files-found: warn
          retention-days: 30

  # SEC-05: CI scans the lockfile on every push. A security advisory is published
  # on its own schedule, so a tree nobody touched can become vulnerable while
  # every run stays green. The scheduled run is what notices that.
  supply-chain:
    name: "Nightly: advisories"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `./task osv-scan` compiles the severity gate (tools/osvgate), which is
      # stdlib only: no nimble packages are installed in this job.
      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: ${{ env.NIM_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: "Supply chain: audit the frontend lockfile"
        run: pnpm audit --audit-level=high --prod
      # Same pin as ci.yml: the sha256 is recorded in deps.lock (`release:`
      # scheme) and `./task deps-check` fails when the two disagree.
      - name: "Supply chain: install the pinned OSV scanner"
        env:
          OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$OSV_URL"
          printf '%s  %s\n' "$OSV_SHA256" "$RUNNER_TEMP/osv-scanner" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
      - name: "Supply chain: scan the lockfile against OSV"
        run: ./task osv-scan

  notify:
    name: "Notify: red nightly"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [full, supply-chain]
    if: failure()
    steps:
      - name: "Notify: post the failure"
        env:
          WEBHOOK: ${{ secrets.MAJADU_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::MAJADU_ALERT_WEBHOOK is not configured; the red nightly is only in GitHub"
            exit 0
          fi
          curl -fsS -m 10 -H "Content-Type: application/json" \
            --data "{\"text\":\"majadu: nightly failed $RUN_URL\"}" \
            "$WEBHOOK"
