# Journal retention for the Majadu host.
#
# The README and operations.md promise that a failed alert unit leaves a
# readable journal line. An unbounded journal is the one failure mode that turns
# that promise into a full disk, which also kills the API.
#
# Install as root (the deploy user cannot write /etc):
#   sudo install -d -m 755 /etc/systemd/journald.conf.d
#   sudo install -m 644 ops/journald/majadu.conf \
#     /etc/systemd/journald.conf.d/50-majadu.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=30day
