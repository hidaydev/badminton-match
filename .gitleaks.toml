# Gitleaks configuration.
#
# Two things kept this file from doing its job until 2026-11-11:
#
#   1. It was named `gitleaks.toml`. gitleaks-action runs `gitleaks detect` with
#      no `--config`, and the CLI only discovers `.gitleaks.toml` beside the
#      source, so the gate never read it.
#   2. It used `[[allowlists]]`, which the gitleaks the action installs (8.24.3,
#      hardcoded in the action's bundle) cannot parse: that version has the one
#      `[allowlist]` table and no array of them. Verified on 8.24.3 (CI) and
#      8.30.1 (a developer's own gitleaks), 12 findings to 0 on both.
#
# The default ruleset stays in force. Every entry below is one finding, matched
# by its exact value: no rule is disabled and no file or directory is exempt, so
# a different secret in the same file, or a regenerated key at the same path,
# still fails the gate. The cost of that choice is also the limit of it: this
# gitleaks version has a single global allowlist whose criteria are ORed, so an
# entry suppresses its value wherever that value appears, which is why each one
# is an exact literal and not a pattern.
#
# Triage behind each value is in .local/verify/2026-11-11-rc1-security-gate.md.

[extend]
useDefault = true

[allowlist]
description = "Twelve full-history findings triaged on 2026-11-11: four fixture values and one committed test key pair, none of them a credential."

regexes = [
  # apps/api/tests/integration/ws_client.nim:28. The Sec-WebSocket-Key sample
  # from RFC 6455 section 1.3, verbatim ("the sample nonce"). It is a fixed
  # handshake nonce the test server ignores, not a key.
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',

  # ops/scripts/cutover.sh:165. The registry user, not the token: the header is
  # built at run time from $APP_DIR/env/ghcr-token, a mode-600 file read on
  # stdin so the token never reaches argv.
  '''^"\$\{MAJADU_GHCR_USER:-hidaydev\}"$''',

  # docs/qa/sessions/QAE-03-test-routes.md:36. The API's own startup refusal
  # line, quoted in a QA transcript; the flag name is the whole match.
  '''^MAJADU_TEST_ROUTES=1$''',

  # docs/superpowers/plans/2026-06-12-backend-migration.md:332,431,506,512,599,
  # 674,900,903. The plan's placeholder bearer token for `vercel dev` against
  # localhost:3000. Eight hits, one value, no server accepts it.
  '''^dev-secret$''',

  # tools/oidc-stub/test_key.pem:1. The committed test double's own key pair,
  # published beside its public half in test_key.pub.pem and used only by
  # tools/oidc-stub and its tests. Production verifies Google's JWKS
  # (OIDC_JWKS_URL default) and no deployment points at the stub. Matched by the
  # key's own DER header so a regenerated key at that path is a new finding.
  '''^-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQDQWHn7''',
]
