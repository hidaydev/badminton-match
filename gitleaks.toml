# Gitleaks configuration.
#
# The action scans the pushed range on a push and the whole history on a
# workflow_dispatch. A full-history scan reaches fixtures that exist to exercise
# authentication: a stub OIDC key, test clients, and curl examples in planning
# notes. None of them is a live credential, and the default ruleset matches
# their shape. Everything else stays on the default rules.

[extend]
useDefault = true

[[allowlists]]
description = "OIDC stub key, API tests, planning documents and secret plumbing"
paths = [
  '''tools/oidc-stub/test_key\.pem''',
  '''apps/api/tests/.*''',
  '''docs/superpowers/.*''',
]
regexes = [
  '''Authorization: Bearer \$\(cat''',
]
